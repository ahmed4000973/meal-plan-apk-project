<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول الأكل الشهري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#16262b;--mute:#5d6f73;--line:#d8e0dd;--acc:#1f7a5c;--accbg:#dff1e9;--b:#b87d00;--l:#1f7a5c;--d:#4a5fa8;--chip:#e8eeec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--card:#182629;--ink:#e6efed;--mute:#9bb0b3;--line:#2a3d41;--acc:#4fc79c;--accbg:#173a2f;--b:#e0a93a;--l:#4fc79c;--d:#8fa3ec;--chip:#22353a}}
:root[data-theme="dark"]{--bg:#0f1a1d;--card:#182629;--ink:#e6efed;--mute:#9bb0b3;--line:#2a3d41;--acc:#4fc79c;--accbg:#173a2f;--b:#e0a93a;--l:#4fc79c;--d:#8fa3ec;--chip:#22353a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button,.wk button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 6px;flex:1;cursor:pointer}
.seg button{font-weight:700;font-size:16px}
.on{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.wk{display:flex;gap:6px}
main{padding:12px;max-width:720px;margin:0 auto}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary .dn{font-weight:700;font-size:17px;min-width:70px}
summary .gm{font-size:12px;color:var(--mute);flex:1}
summary .tt{font-size:13px;font-weight:600;text-align:left;white-space:nowrap}
.gym{color:var(--acc);font-weight:600}
.meal{padding:12px 14px;border-top:1px solid var(--line);border-right:5px solid var(--c)}
.meal h3{margin:0 0 2px;font-size:15px}
.sec{font-size:12px;font-weight:700;color:var(--c)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px}
.tm{background:var(--accbg);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px;margin:6px 0}
ul{list-style:none;margin:6px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
li span:last-child{color:var(--mute);text-align:left;white-space:nowrap}
li b{font-weight:600;color:var(--ink);margin-inline-start:6px}
.sp{font-size:13px;color:var(--mute);margin-top:6px}
h2{font-size:17px;margin:18px 0 6px}
.hint{font-size:13px;color:var(--mute);margin:4px 0 10px}
label.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
label.row input{width:20px;height:20px;accent-color:var(--acc);flex:none}
label.row .n{flex:1}label.row .q{font-weight:700;white-space:nowrap}
label.row.done{opacity:.5}label.row.done .n{text-decoration:line-through}
button.sm{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;margin-bottom:10px}
.eat{display:flex;gap:8px;align-items:center;float:left;font-size:13px;color:var(--mute)}.eat input{width:20px;height:20px;accent-color:var(--acc)}.cnt{color:var(--acc)}.rs{margin-top:24px;padding-top:12px;border-top:1px solid var(--line)}.danger{color:#b3261e;border-color:#b3261e}
</style></head><body>

const COL={"فطار":"var(--b)","غدا":"var(--l)","عشا":"var(--d)"};
let view="meals",wk=0;
const $=s=>document.querySelector(s);
const P="mp:";
const sg=(k)=>{try{return localStorage.getItem(P+k)}catch(e){return null}};
const ss=(k,v)=>{try{v?localStorage.setItem(P+k,"1"):localStorage.removeItem(P+k)}catch(e){}};
function loadPos(){try{const p=JSON.parse(localStorage.getItem(P+"pos"));if(p){view=p.view==="shop"?"shop":"meals";wk=Math.min(3,Math.max(0,+p.wk||0))}}catch(e){}}
function savePos(){try{localStorage.setItem(P+"pos",JSON.stringify({view,wk}))}catch(e){}}
function resetAll(){try{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k))}catch(e){}view="meals";wk=0;render();scrollTo(0,0)}
function meal(m,key){return `<div class="meal" style="--c:${COL[m.sec]}"><label class="eat"><input type="checkbox" data-m="${key}" ${sg(key)?"checked":""}><span>تم أكلها</span></label><div class="sec">${m.sec}</div><h3>${m.name}</h3>
<div class="meta"><span class="chip">${m.k} سعرة</span><span class="chip">${m.p} جم بروتين</span><span class="chip">${m.diff}</span></div>
${m.timing?`<div class="tm">⏰ ${m.timing}</div>`:""}
<ul>${m.items.map(i=>`<li><span>${i[0]}${i[2]?`<b>${i[2]}</b>`:""}</span><span>${i[1]}</span></li>`).join("")}</ul>
${m.sp?`<div class="sp">توابل: ${m.sp}</div>`:""}${m.flav?`<div class="sp">نكهة اليوم: ${m.flav}</div>`:""}</div>`}
function renderMeals(){
 $("#app").innerHTML=`<button class="sm" id="all">فتح الكل / قفل الكل</button>`+D.weeks[wk].map((d,i)=>`<details ${i==0?"open":""}><summary><span class="dn">${d.d}</span><span class="gm ${d.gym.startsWith("جيم")?"gym":""}">${d.gym}</span><span class="tt">${d.k} سعرة<br>${d.p} جم بروتين<br><span class="cnt">✓ ${d.meals.filter(m=>sg("m"+wk+"-"+i+"-"+m.sec)).length}/3</span></span></summary>${d.meals.map(m=>meal(m,"m"+wk+"-"+i+"-"+m.sec)).join("")}</details>`).join("");
 document.querySelectorAll("input[data-m]").forEach(c=>c.onchange=()=>{ss(c.dataset.m,c.checked);const dt=c.closest("details");dt.querySelector(".cnt").textContent="✓ "+dt.querySelectorAll("input[data-m]:checked").length+"/3"});
 $("#all").onclick=()=>{const a=[...document.querySelectorAll("details")];const o=a.some(x=>!x.open);a.forEach(x=>x.open=o)};
}
function renderShop(){
 let n=0;const keyw=wk;
 let h=`<div class="hint">اشتري قبل يوم الأحد. الكميات للأسبوع ${wk+1} بس (الأوزان نيئة)، ومقرّبة لأقرب 10 جم لفوق.</div>`;
 D.shop[wk].forEach(g=>{h+=`<h2>${g[0]}</h2>`;g[1].forEach(it=>{const k="s"+keyw+"-"+(n++);h+=`<label class="row ${sg(k)?"done":""}"><input type="checkbox" data-k="${k}" ${sg(k)?"checked":""}><span class="n">${it[0]}</span><span class="q">${it[1]}</span></label>`})});
 h+=`<h2>المخزن: اشتريه مرة واحدة</h2><div class="hint">حاجات عمرها طويل (توابل وزيت وسكر ودقيق وزبيب). الكمية الشهرية كاملة، ومش داخلة في مشتريات الأسبوع.</div>`;
 D.pantry.forEach(p=>{h+=`<label class="row"><span class="n">${p[0]}</span><span class="q" style="font-weight:400;font-size:13px">${p[1]}</span></label>`});
 $("#app").innerHTML=h;
 document.querySelectorAll("input[data-k]").forEach(c=>c.onchange=()=>{ss(c.dataset.k,c.checked);c.parentNode.classList.toggle("done",c.checked)});
}
function render(){
 $("#vm").classList.toggle("on",view=="meals");$("#vs").classList.toggle("on",view=="shop");
 $("#wk").innerHTML=[0,1,2,3].map(i=>`<button class="${i==wk?"on":""}" data-w="${i}">الأسبوع ${i+1}</button>`).join("");
 document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{wk=+b.dataset.w;render();scrollTo(0,0)});
 savePos();view=="meals"?renderMeals():renderShop();
 $("#app").insertAdjacentHTML("beforeend",`<div class="rs"><button class="sm danger" id="rb">إعادة ضبط كل البيانات</button><div id="rc" hidden><div class="hint">هيتمسح كل اللي علّمت عليه (الوجبات والمشتريات) وترجع للأسبوع الأول. متأكد؟</div><button class="sm danger" id="ry">أيوه، امسح</button> <button class="sm" id="rn">لأ</button></div></div>`);
 $("#rb").onclick=()=>{$("#rb").hidden=true;$("#rc").hidden=false};$("#rn").onclick=()=>{$("#rb").hidden=false;$("#rc").hidden=true};$("#ry").onclick=resetAll;
}
$("#vm").onclick=()=>{view="meals";render()};$("#vs").onclick=()=>{view="shop";render()};
loadPos();render();
</script></body></html>
